<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Examples</title>
    <link rel="stylesheet" href="pseudo.css">
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#contact">Contact</a>
        <a href="#about">About</a>
    </nav>
    <input type="checkbox" id="check">
    <label for="check" class="check-label">Accept Terms</label>
    <ol class="steps">
        <li>First step</li>
        <li>Second step</li>
        <li>Third Step</li>
    </ol>
    <button class="tooltip" data-tooltip="Save your changes">Save</button>
</body>
</html>
