<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specifity</title>
    <style>
        /* According to CSS speciality rules */

        /* element has the least specificity (0,0,0,1) */
        p{
            background-color: aqua !important; /*  !important just overrides every other specificity  */
            border: 10px solid rgb(216, 29, 29);
            outline: 2 cm solid rgb(223, 55, 14);
        }
        /* class selectors have the 3rd specificity (0,0,1,0) */
        .para{
            background-color: aquamarine;
            border: 50px solid black;
            

        }
        /* id class selectors have the 2nd specificity (0,1,0,0) */
        #para{
            background-color: black;
            width: 50%;
            margin: 4cm;

        }

        /* root or all selector has no specificity (0,0,0,0)*/
        *{
            background-color: blue;
            margin: 10px;
            outline: 10cm;
        }

    </style>
</head>
<body>
<!-- inline styles has the first priority (1,0,0,0) -->
    <p id="para" class="para" style="background-color:rgb(248, 141, 0); border: 20px solid salmon;">This is a paragraph.</p>
</body>
</html>
