<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Items</title>
    <link rel="stylesheet" href="flex-items.css">
</head>
<body>
    <h2>flex-grow</h2>
    <div class="grow-container">
        <div class="grow-item item1">1</div>
        <div class="grow-item item2">2</div>
        <div class="grow-item item3">3</div>
        <div class="grow-item item4">4</div>
        <div class="grow-item item5">5</div>
    </div>
    <h2>flex-shrink</h2>
    <div class="shrink-container">

        <div class="shrink-item shrink-1">1</div>
        <div class="shrink-item shrink-2">2</div>
        <div class="shrink-item shrink-3">3</div>
        <div class="shrink-item shrink-4">4</div>
        <div class="shrink-item shrink-5">5</div>

    </div>
    <h2>basis</h2>
    <div class="basis-container">
        
        <div class="basis-item basis-zero">
            basis: 0
        </div>

        <div class="basis-item basis-auto">
            basis: auto
        </div>

        <div class="basis-item basis-200">
            basis: 200px
        </div>

        <div class="basis-item basis-third">
            basis: 33.333%
        </div>

    </div>
    <h2>order</h2>
    <div class="order-container">
        <div class="order-item order1">1</div>
        <div class="order-item order2">2</div>
        <div class="order-item order3">3</div>
        <div class="order-item order4">4</div>
        <div class="order-item order5">5</div>
    </div>
    <h2>override</h2>
    <div class="align-container">
        <div class="align-item">1</div>
        <div class="align-item">2</div>
        <div class="align-item override">3</div>
        <div class="align-item">4</div>
        <div class="align-item">5</div>
    </div>
</body>
</html>
