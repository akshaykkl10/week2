<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Demo</title>
    <style>
        p{
            font-size: small;
        }
        p{
            transition: transform 2s ease-out;
        }
        p:hover{
            transform:translateX(300px);
        }
    </style>
</head>
<body>
    <p>This is demo.</p>
</body>
</html>
