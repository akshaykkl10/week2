<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Components</title>
    <link rel="stylesheet" href="task6.css">
</head>
<body>
    <div class="accordion">
        <h1 class="accordion-title">What's in here</h1>
        <label for="accordion-trigger" class="accordion-label">Click here to see!</label>
        <input type="checkbox" id="accordion-trigger">
        <p class="accordion-content">
            Hey there! This is an Accordion.
        </p>
    </div>
    <label for="panel1">Panel 1</label>
    <input type="radio" name="panel" id="panel1">
    <label for="panel2">Panel 2</label>
    <input type="radio" name="panel" id="panel2">
    <label for="panel3">Panel 3</label>
    <input type="radio" name="panel" id="panel3">
    <label for="panel4">Panel 4</label>
    <input type="radio" name="panel" id="panel4">
    <div class="panel panel1">
        <h2>This is  panel  1</h2>
        <p>Panel 1 content is shown here</p>
    </div>
    <div class="panel panel2">
        <h2>This is  panel  2</h2>
        <p>Panel 2 content is shown here</p>
    </div>
    <div class="panel panel3">
        <h2>This is  panel 3</h2>
        <p>Panel 3 content is shown here</p>
    </div>
    <div class="panel panel4">
        <h2>This is  panel  4</h2>
        <p>Panel 4 content is shown here</p>
    </div>


    <div class="rating">
        <h2>Rate this Page</h2>
        <div class="stars">
            <input type="radio" name="rate" id="1star" class="radiostar">
            <label for="1star"></label>
            <input type="radio" name="rate" id="2star" class="radiostar">
            <label for="2star"></label>
            <input type="radio" name="rate" id="3star" class="radiostar">
            <label for="3star"></label>
            <input type="radio" name="rate" id="4star" class="radiostar">
            <label for="4star"></label>
            <input type="radio" name="rate" id="5star" class="radiostar">
            <label for="5star"></label>
        </div>
    </div>
</body>
</html>
